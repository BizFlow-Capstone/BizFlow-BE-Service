# =============================================================================
# BizFlow Docker Compose - VPS overrides
# =============================================================================
# Purpose:
# - Pull images from Docker Hub instead of building on VPS
# - Disable local nginx service because Nginx Proxy Manager runs separately
# - Keep AI internal-only while allowing NPM -> API through shared external network
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.vps.yml --env-file .env.prod --profile ai pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.vps.yml --env-file .env.prod --profile ai up -d
# =============================================================================

services:
  nginx:
    # Disable this service by default on VPS (NPM already handles 80/443)
    profiles: ["disabled"]

  bizflow-api:
    image: ${DOCKERHUB_USERNAME}/bizflow-api:${IMAGE_TAG}
    build: null
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - bizflow-network
      - proxy-network

  bizflow-ai:
    image: ${DOCKERHUB_USERNAME}/bizflow-ai:${IMAGE_TAG}
    build: null
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  # ---------------------------------------------------------------------------
  # Dozzle — container log viewer
  # Auth: simple login via docker/dozzle/users.yml
  # Exposed internally only; NPM proxies it to https://logs.bizflow.asia (or similar)
  # ---------------------------------------------------------------------------
  dozzle:
    image: amir20/dozzle:latest
    container_name: bizflow-dozzle
    restart: unless-stopped
    environment:
      - DOZZLE_AUTH_PROVIDER=simple
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/dozzle/users.yml:/data/users.yml:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthcheck || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true

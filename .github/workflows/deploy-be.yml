# =============================================================================
# CI/CD — BizFlow BE (bizflow-api)
# =============================================================================
# Trigger: manual (Actions → Deploy BE → Run workflow → chọn branch → gõ 'true')
# Steps:
#   1. Build Docker image from bizflow-platform/Dockerfile
#   2. Push to Docker Hub as :latest and :<git-sha>
#   3. SSH to VPS → git pull compose files → docker compose pull + up -d
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME   — Docker Hub username
#   DOCKERHUB_TOKEN      — Docker Hub access token (not password)
#   VPS_HOST             — VPS IP or domain (e.g. 123.45.67.89)
#   VPS_USER             — SSH user (usually root)
#   VPS_SSH_KEY          — SSH private key (ed25519 recommended)
#
# VPS one-time setup (run manually):
#   git clone <this-repo-url> /opt/bizflow/bizflow-app
#   cp docker/credentials/* /opt/bizflow/bizflow-app/docker/credentials/
#   nano /opt/bizflow/bizflow-app/.env.prod
# =============================================================================

name: Deploy BE to Production

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'true' to confirm deploying to production"
        required: true
        type: string

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'true' && github.ref_name == 'deployment' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./bizflow-platform
          file: ./bizflow-platform/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bizflow-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bizflow-api:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/bizflow-api:latest
          cache-to: type=inline

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'deployment' }}

    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/bizflow/bizflow-app

            # Always deploy compose files from deployment branch
            git fetch origin deployment
            git checkout deployment
            git reset --hard origin/deployment

            # ── Step 1: Start MySQL and wait until healthy ─────────────────────
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              -f docker-compose.vps.yml \
              --env-file .env.prod \
              up -d mysql

            echo "[deploy] Waiting for MySQL to be healthy..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' bizflow-mysql 2>/dev/null || echo "missing")
              if [ "$STATUS" = "healthy" ]; then
                echo "[deploy] MySQL is healthy."
                break
              fi
              echo "[deploy] MySQL status: $STATUS — waiting 5s ($i/30)..."
              sleep 5
            done
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' bizflow-mysql 2>/dev/null || echo "missing")
            if [ "$STATUS" != "healthy" ]; then
              echo "[error] MySQL did not become healthy in time." && exit 1
            fi

            # ── Step 2: Best-effort alembic to create AI tables early ──────────
            # Non-fatal: migration 108 self-skips via IF EXISTS if AI tables absent.
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              -f docker-compose.vps.yml \
              --env-file .env.prod \
              --profile ai \
              pull bizflow-ai || echo "[warn] Could not pull bizflow-ai image — skipping AI schema migration"

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              -f docker-compose.vps.yml \
              --env-file .env.prod \
              --profile ai \
              run --rm -T bizflow-ai \
              alembic upgrade head || echo "[warn] AI alembic migration skipped or failed — migration 108 will self-skip"

            # ── Step 3: Apply any pending BE SQL migrations ─────────────────────
            bash docker/scripts/run-migrations.sh

            # ── Step 4: Pull new API image and restart ──────────────────────────
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              -f docker-compose.vps.yml \
              --env-file .env.prod \
              pull bizflow-api


            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              -f docker-compose.vps.yml \
              --env-file .env.prod \
              up -d --no-build bizflow-api

            # Clean up dangling images to save disk space
            docker image prune -f

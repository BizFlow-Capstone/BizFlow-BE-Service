# =============================================================================
# BizFlow Docker Compose - PRODUCTION overrides
# =============================================================================
# Extends docker-compose.yml for the production environment on the VPS.
# Database is hosted externally on Aiven.io — no local MySQL container.
#
# Usage (on VPS):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod pull && \
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d  # rolling update
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Nginx — reverse proxy + SSL termination
  # SSL certs are managed by Certbot (Let's Encrypt) on the VPS host.
  # Run once to obtain cert: certbot certonly --standalone -d your-domain.com
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: bizflow-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro      # Let's Encrypt certs from host
    depends_on:
      - bizflow-api
    networks:
      - bizflow-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # API — production settings
  # No direct port exposure; traffic flows through Nginx only.
  # ---------------------------------------------------------------------------
  bizflow-api:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ---------------------------------------------------------------------------
  # AI Service — production settings (start with --profile ai)
  # ---------------------------------------------------------------------------
  bizflow-ai:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

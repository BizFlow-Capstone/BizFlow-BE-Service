# =============================================================================
# BizFlow Docker Compose - PRODUCTION overrides
# =============================================================================
# Extends docker-compose.yml for the production environment on the VPS.
# MySQL runs as a container on the same VPS.
# Reverse proxy is handled by Nginx Proxy Manager (separate stack at /opt/bizflow/nginx-proxy-manager).
#
# Pre-requisites on VPS (one-time):
#   docker network create proxy-network
#   git clone <BE-repo> /opt/bizflow/bizflow-app
#   cp docker/credentials/* /opt/bizflow/bizflow-app/docker/credentials/
#   nano /opt/bizflow/bizflow-app/.env.prod       # fill in all secrets
#
# Usage (on VPS — initial deploy):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d
#
# With AI service:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod --profile ai up -d
#
# Rolling update (done automatically by CI/CD):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod pull bizflow-api
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d --no-build bizflow-api
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # MySQL — self-hosted on VPS
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: bizflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bizflow_db}
      MYSQL_USER: ${MYSQL_USER:-bizflow_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - bizflow-network
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ---------------------------------------------------------------------------
  # MySQL Backup (prod — daily dump, stored in ./backups)
  # ---------------------------------------------------------------------------
  mysql-backup:
    image: mysql:8.0
    container_name: bizflow-mysql-backup
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER:-bizflow_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bizflow_db}
    volumes:
      - ./backups:/backups
      - ./docker/scripts/backup.sh:/backup.sh:ro
    command: /bin/bash -c "chmod +x /backup.sh && while true; do /backup.sh; sleep 86400; done"
    networks:
      - bizflow-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # ---------------------------------------------------------------------------
  # API — pre-built image from Docker Hub
  # Joined to proxy-network so Nginx Proxy Manager can route traffic.
  # ---------------------------------------------------------------------------
  bizflow-api:
    image: ${DOCKERHUB_USERNAME}/bizflow-api:${IMAGE_TAG:-latest}
    build: null                             # override build from base — use pre-built image only
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - bizflow-network
      - proxy-network             # NPM routes to this container via this network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ---------------------------------------------------------------------------
  # AI Service — pre-built image from Docker Hub (start with --profile ai)
  # Internal only — NOT joined to proxy-network (container-to-container only).
  # ---------------------------------------------------------------------------
  bizflow-ai:
    image: ${DOCKERHUB_USERNAME}/bizflow-ai:${IMAGE_TAG:-latest}
    build: null                             # override build from base — use pre-built image only
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - bizflow-network           # internal only — BE calls AI via this network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

networks:
  proxy-network:
    external: true

volumes:
  mysql_data:

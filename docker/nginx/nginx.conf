# =============================================================================
# Nginx — Production Reverse Proxy Configuration
# =============================================================================
# Prerequisites on the VPS:
#   1. Install Certbot: apt install certbot
#   2. Obtain certificate: certbot certonly --standalone -d api.your-domain.com
#   3. Certs will be at: /etc/letsencrypt/live/api.your-domain.com/
#   4. Replace "api.your-domain.com" below with your actual domain
# =============================================================================

# Route traffic to the .NET API container
upstream bizflow_api {
    server bizflow-api:8080;
    keepalive 32;
}

# Route traffic to the Python AI container (only active with --profile ai)
upstream bizflow_ai {
    server bizflow-ai:5000;
    keepalive 8;
}

# ---------------------------------------------------------------------------
# HTTP — redirect all traffic to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name api.your-domain.com;

    # Let Certbot challenge pass through before redirect
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — main server
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name api.your-domain.com;

    # Let's Encrypt certificates (mounted from host via docker-compose.prod.yml)
    ssl_certificate     /etc/letsencrypt/live/api.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.your-domain.com/privkey.pem;

    # Modern SSL settings
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options           DENY;
    add_header X-Content-Type-Options    nosniff;
    add_header X-XSS-Protection          "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Max upload size (for product/import images)
    client_max_body_size 10M;

    # ------------------------------------------------------------------
    # BizFlow .NET API
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://bizflow_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ------------------------------------------------------------------
    # Swagger UI (disable in production or restrict by IP)
    # ------------------------------------------------------------------
    location /swagger {
        # Uncomment to restrict to specific IP:
        # allow 1.2.3.4;
        # deny all;
        proxy_pass         http://bizflow_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # Hangfire Dashboard (restrict to admin access)
    # ------------------------------------------------------------------
    location /hangfire {
        # IMPORTANT: Restrict this in production
        # allow 1.2.3.4;   # Replace with your IP
        # deny all;
        proxy_pass         http://bizflow_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # Python AI Service (only active when started with --profile ai)
    # ------------------------------------------------------------------
    location /ai/ {
        proxy_pass         http://bizflow_ai;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;             # AI can take longer to respond
    }
}
